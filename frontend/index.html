<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Log Viewer</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
    <header class="topbar">
        <h1>Log Viewer</h1>
        <select id="bucket-select"><option value="">Select a bucket…</option></select>
        <button id="refresh-buckets-btn" class="ghost-btn" title="Refresh bucket list">⟳</button>
        <div id="auth-pill" class="pill">Checking credentials…</div>
    </header>

    <div id="bucket-empty-state" class="empty-state">
        Pick a bucket above to start searching.
    </div>

    <div id="main" hidden>
        <div class="query-bar">
            <input id="query-input" type="text"
                   placeholder="Search anywhere in the log line — any field, not just the ones below…"/>
            <input id="filter-from" type="datetime-local" title="From"/>
            <span class="query-bar-sep">→</span>
            <input id="filter-to" type="datetime-local" title="To"/>
            <select id="filter-level"><option value="">All levels</option></select>
            <button id="search-btn" class="primary-btn">Search</button>
        </div>

        <details id="advanced-filters">
            <summary>Advanced filters</summary>
            <div class="advanced-filters-row">
                <label>Message contains <input id="filter-msg" type="text"/></label>
                <label>Topic contains <input id="filter-topic" type="text"/></label>
                <label>Accession contains <input id="filter-accession" type="text"/></label>
                <label>Study UID contains <input id="filter-studyuid" type="text"/></label>
            </div>
        </details>

        <div id="search-status" class="status-line"></div>

        <table id="results-table" class="log-table">
            <thead>
            <tr><th class="col-time">Time</th><th class="col-level">Level</th><th>Message</th><th class="col-source">Source</th></tr>
            </thead>
            <tbody></tbody>
        </table>

        <details class="side-panel">
            <summary>Load files from GCS</summary>
            <div class="row">
                <input id="prefix-input" type="text" placeholder="key prefix, e.g. logs/gateway-2026-09"/>
                <button id="find-files-btn">Find files</button>
                <button id="load-files-btn" disabled>Load selected</button>
            </div>
            <table class="files-table">
                <thead>
                <tr><th></th><th>Name</th><th>Size</th><th>Last modified</th><th>Loaded</th></tr>
                </thead>
                <tbody id="files-tbody"></tbody>
            </table>
            <div id="load-summary"></div>
        </details>

        <details class="side-panel">
            <summary>Retention cleanup</summary>
            <div class="row">
                <label>Delete rows older than <input id="retention-cutoff" type="date"/></label>
                <button id="retention-btn">Delete</button>
                <span id="retention-status" class="status-line"></span>
            </div>
        </details>
    </div>
</div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
